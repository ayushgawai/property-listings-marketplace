[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "property-listings-marketplace"
version = "0.1.0"
description = "A property-listings marketplace with listing ingestion, property search/discovery, saved properties and inquiry connections"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ayush Gawai" }]
dependencies = []

[project.scripts]
marketplace = "marketplace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
